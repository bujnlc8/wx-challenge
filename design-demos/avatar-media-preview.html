<!doctype html><meta charset="utf-8"><title>默认头像与题图预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f0f5fc;color:#202b40;font:16px system-ui;padding:36px}h1{font-size:24px}h2{font-size:17px;margin:0 0 20px}.row{display:flex;align-items:center;gap:30px;flex-wrap:wrap}.card{background:white;padding:24px;border-radius:20px;margin:16px 0;max-width:960px}figure{margin:0;text-align:center}figcaption{font-size:13px;color:#68758a;margin-top:8px}canvas{display:block}.avatars img{display:block;border-radius:50%}.avatars figure{min-width:100px}.media{width:300px;height:200px;border-radius:12px;object-fit:contain;background:#f5f8ff}.note{color:#68758a;font-size:14px;line-height:1.7}.posters{align-items:flex-start}.posters canvas{width:240px;height:auto;border-radius:10px;border:1px solid #dce5f3}</style>
<h1>默认头像与题图预览</h1>
<div class="card"><h2>知识探索者 · 默认头像</h2><div class="row avatars"><figure><img id="avatar" src="../images/default_avatar.png" width="192" height="192"><figcaption>192 px 原始资源</figcaption></figure><figure><img src="../images/default_avatar.png" width="80" height="80"><figcaption>80 px</figcaption></figure><figure><img src="../images/default_avatar.png" width="40" height="40"><figcaption>40 px</figcaption></figure></div></div>
<div class="card"><h2>答题页题图 · 固定 200 px 完整显示</h2><div class="row" id="page-media"></div><p class="note">这是浏览器视觉预览；原生微信小程序的最终比例与视频播放仍需开发者工具/真机验收。</p></div>
<div class="card"><h2>题目海报 · 固定 360 画布像素题图</h2><div class="row posters" id="posters"></div><p class="note">使用真实海报绘制函数。预览码为本地演示占位，发布时仍绘制服务端返回的小程序码。</p></div>
<script type="module">
import {normalizeQuestion, layoutPoster, drawPoster} from '../utils/question-poster-render.js';
const avatar=document.getElementById('avatar');await avatar.decode();const output=document.createElement('canvas');output.width=output.height=192;output.getContext('2d').drawImage(avatar,0,0,192,192);window.avatarPng=output.toDataURL('image/png');
const sample=(w,h,label)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#e2ebff';x.fillRect(0,0,w,h);x.strokeStyle='#4b81e8';x.lineWidth=5;x.strokeRect(6,6,w-12,h-12);x.font=`${Math.min(w,h)*.12}px sans-serif`;x.fillStyle='#2859b2';x.textAlign='center';x.textBaseline='middle';x.fillText(label,w/2,h/2);x.fillStyle='#f1bc54';for(const [cx,cy] of [[20,20],[w-20,20],[20,h-20],[w-20,h-20]]){x.beginPath();x.arc(cx,cy,8,0,7);x.fill()}return c};
const code=sample(300,300,'预览码');
for(const [name,w,h] of [['横图',1200,600],['竖图',600,1800]]){const img=sample(w,h,name+' · 四角完整');const f=document.createElement('figure');const picture=new Image();picture.className='media';picture.src=img.toDataURL();f.append(picture);document.getElementById('page-media').append(f);const src='/preview-'+name+'.png';const q=normalizeQuestion({id:42,content:'请根据图片中的信息作答。',question_image:src,options:['第一项：图形完整','第二项：保留所有选项']});const c=document.createElement('canvas'),x=c.getContext('2d'),images={[src]:img};const l=layoutPoster(x,q,images);c.width=l.width;c.height=l.height;drawPoster(x,l,q,images,code,null,'release');document.getElementById('posters').append(c)}
const q=normalizeQuestion({id:43,content:'观看视频后，选择正确答案。',question_image:'/preview-video.mp4',options:['第一项','第二项']});const c=document.createElement('canvas'),x=c.getContext('2d'),l=layoutPoster(x,q,{});c.width=l.width;c.height=l.height;drawPoster(x,l,q,{},code,null,'release');document.getElementById('posters').append(c);window.previewReady=true;
</script>
